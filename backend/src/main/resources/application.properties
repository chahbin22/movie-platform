spring.application.name=backend

# =========================
# Database
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:movie_platform}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# TMDB
# =========================
tmdb.access-token=${TMDB_ACCESS_TOKEN}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# =========================
# Server
# =========================
server.port=${PORT:8080}